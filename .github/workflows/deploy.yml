name: Deploy Rails App

on:
  workflow_dispatch:

  push:
    branches:
      - develop
      - feature/5-application-cicd # 一時的に feature ブランチも対象にする

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Debug OIDC claims
        shell: bash
        run: |
          RESPONSE=$(curl -sS \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$RESPONSE" | jq -r '.value')
          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2)

          # Base64URL -> Base64
          PAYLOAD="${PAYLOAD//-/+}"
          PAYLOAD="${PAYLOAD//_/\/}"

          # padding
          case $((${#PAYLOAD} % 4)) in
            2) PAYLOAD="${PAYLOAD}==" ;;
            3) PAYLOAD="${PAYLOAD}=" ;;
          esac

          echo "$PAYLOAD" | base64 --decode | jq '{sub, aud, repository, ref}'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::867344446779:role/rails-aws-sre-lab-github-actions-deploy-role
          aws-region: ap-northeast-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: image
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"
          IMAGE_URI="867344446779.dkr.ecr.ap-northeast-1.amazonaws.com/rails-aws-sre-lab:${IMAGE_TAG}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        working-directory: app
        run: |
          docker build \
            --platform linux/arm64 \
            --provenance=false \
            -t "${{ steps.image.outputs.image_uri }}" \
            .

      - name: Push Docker image to ECR
        run: |
          docker push "${{ steps.image.outputs.image_uri }}"
