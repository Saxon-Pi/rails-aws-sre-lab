# Terraform では CI (plan) と CD (apply) は同一ファイルで定義する

name: Terraform CI/CD

on:
  # 手動実行でも CI 実行可能
  workflow_dispatch:

  # CI は PR 作成・更新タイミング
  pull_request:
    branches:
      - develop
      - main
  
  # CD は Terraform 関連ファイルが変更された develop push のみ
  push:
    branches:
      - develop
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read

jobs:
  # CI (terraform planまで) を実行
  plan: # Job ID
    name: Terraform Plan
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      TF_VAR_slack_workspace_id: ${{ vars.TF_VAR_slack_workspace_id }}
      TF_VAR_slack_channel_id: ${{ vars.TF_VAR_slack_channel_id }}

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect Terraform changes
        id: changes
        shell: bash
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "terraform=true" >> "$GITHUB_OUTPUT"
            echo "Manual run: Terraform Plan will run."
            exit 0
          fi

          if git diff --quiet \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" \
            -- terraform/ .github/workflows/terraform.yml; then

            echo "terraform=false" >> "$GITHUB_OUTPUT"
            echo "No Terraform-related changes. Terraform steps will be skipped."
          else
            echo "terraform=true" >> "$GITHUB_OUTPUT"
            echo "Terraform-related changes detected."
          fi

      - name: Configure AWS credentials
        if: steps.changes.outputs.terraform == 'true'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::867344446779:role/rails-aws-sre-lab-github-actions-terraform-role
          aws-region: ap-northeast-1

      - name: Verify AWS identity
        if: steps.changes.outputs.terraform == 'true'
        run: aws sts get-caller-identity

      # terraform fmt -> terraform validate -> terraform plan
      - name: Setup Terraform
        if: steps.changes.outputs.terraform == 'true'
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        if: steps.changes.outputs.terraform == 'true'
        run: terraform fmt -check -recursive

      # この Terraform ディレクトリを実行可能な状態に初期化するコマンド
      # (backend.tf をもとに S3 Backend に接続することで Remote State を使って plan できるようにする、ことも含む)
      - name: Terraform Init
        if: steps.changes.outputs.terraform == 'true'
        run: terraform init -input=false

      - name: Terraform Validate
        if: steps.changes.outputs.terraform == 'true'
        run: terraform validate

      - name: Terraform Plan
        if: steps.changes.outputs.terraform == 'true'
        run: terraform plan -input=false -no-color

  # CD (terraform apply) を実行
  apply: # Job ID
    name: Terraform Apply
    # push イベント かつ push 先が develop ブランチであれば実行
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      TF_VAR_slack_workspace_id: ${{ vars.TF_VAR_slack_workspace_id }}
      TF_VAR_slack_channel_id: ${{ vars.TF_VAR_slack_channel_id }}

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::867344446779:role/rails-aws-sre-lab-github-actions-terraform-role
          aws-region: ap-northeast-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve
